    <script>
        const SALT = "BKH_GLOBAL_PROTECT_2026";
        const MASTER_DB_KEY = "SECRET-BKH-DOC";
        let patients = [];
        let patientActuelId = null;

        window.onload = () => {
            if(CONFIG_LOGO_BASE64.startsWith("data:image")) {
                document.querySelectorAll('.sys-logo-src').forEach(img => img.src = CONFIG_LOGO_BASE64);
            }
            const license = localStorage.getItem('doc_license_active');
            const security = localStorage.getItem('doc_security_cfg');
            if(!license) document.getElementById('screen-activation').classList.remove('hidden');
            else if(!security) document.getElementById('screen-config-pin').classList.remove('hidden');
            else document.getElementById('screen-lock').classList.remove('hidden');
        };

        function validerActivation() {
            const name = document.getElementById('lic-name').value.trim().toUpperCase();
            const key = document.getElementById('lic-key').value.trim();
            const expected = CryptoJS.HmacSHA256(name, SALT).toString().toUpperCase().match(/.{1,4}/g).slice(0, 5).join('-');
            if(key === expected && name.length > 2) {
                localStorage.setItem('doc_license_active', name);
                location.reload();
            } else alert("Clé invalide.");
        }

        function enregistrerConfigSecu() {
            const p1 = document.getElementById('cfg-pin').value;
            if (p1 === document.getElementById('cfg-pin-confirm').value && p1.length >= 4) {
                localStorage.setItem('doc_security_cfg', JSON.stringify({ pinHash: CryptoJS.SHA256(p1).toString() }));
                location.reload();
            } else alert("Erreur PIN.");
        }

        function deverrouillerParPin() {
            const pin = document.getElementById('lock-pin-input').value;
            const cfg = JSON.parse(localStorage.getItem('doc_security_cfg'));
            if (CryptoJS.SHA256(pin).toString() === cfg.pinHash) {
                document.getElementById('screen-lock').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                chargerDB();
            } else alert("PIN Incorrect.");
        }

        function chargerDB() {
            const stored = localStorage.getItem('doc_patients_db_final_v1');
            if (stored) {
                try {
                    const bytes = CryptoJS.AES.decrypt(stored, MASTER_DB_KEY);
                    patients = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
                } catch (e) { patients = []; }
            }
            afficherPatients();
        }

        function sauvegarderDB() {
            localStorage.setItem('doc_patients_db_final_v1', CryptoJS.AES.encrypt(JSON.stringify(patients), MASTER_DB_KEY).toString());
        }

        function validerSaisie() {
            const dataV = {
                id: Date.now(), date: new Date().toLocaleString('fr-FR'),
                ta: document.getElementById('c-ta').value, pouls: document.getElementById('c-pouls').value,
                temp: document.getElementById('c-temp').value, fr: document.getElementById('c-fr').value,
                sat: document.getElementById('c-sat').value, motif: document.getElementById('c-motif').value,
                general: document.getElementById('c-general').value, hemo: document.getElementById('c-hemo').value,
                respi: document.getElementById('c-respi').value, abd: document.getElementById('c-abd').value,
                neuro: document.getElementById('c-neuro').value, reste: document.getElementById('c-reste').value,
                traitement: document.getElementById('c-traitement').value
            };
            if (patientActuelId === null) {
                const p = {
                    id: Date.now(), nom: document.getElementById('p-nom').value.toUpperCase(),
                    dob: `${document.getElementById('p-jj').value}/${document.getElementById('p-mm').value}/${document.getElementById('p-aaaa').value}`,
                    origine: document.getElementById('p-origine').value, age: document.getElementById('p-age').value, tel: document.getElementById('p-tel').value,
                    visites: [dataV]
                };
                patients.unshift(p); patientActuelId = p.id;
            } else {
                patients.find(x => x.id === patientActuelId).visites.unshift(dataV);
            }
            sauvegarderDB(); fermerModal(); voirDossier(patientActuelId);
        }

        function voirDossier(id) {
            patientActuelId = id; const p = patients.find(x => x.id === id);
            document.getElementById('vue-liste').classList.add('hidden');
            document.getElementById('vue-dossier').classList.remove('hidden');
            document.getElementById('view-nom').innerText = p.nom;
            document.getElementById('view-infos').innerText = `NÉ LE ${p.dob} (${p.age}) • ORIGINE: ${p.origine}`;
            document.getElementById('historiqueList').innerHTML = p.visites.map(v => `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-[9px] font-black uppercase">${v.date}</span>
                    <p class="text-[10px] font-bold text-red-600 my-2">TA: ${v.ta} | P: ${v.pouls} | T: ${v.temp}°C | Sat: ${v.sat}%</p>
                    <p class="text-xs italic text-slate-600"><b>Motif:</b> ${v.motif}</p>
                </div>`).join('');
        }

        function preparerExport() {
            const p = patients.find(x => x.id === patientActuelId);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(16); doc.text(`DOSSIER MÉDICAL : ${p.nom}`, 20, 20);
            doc.setFontSize(10); doc.text(`Né le: ${p.dob} (${p.age}) | Origine: ${p.origine} | Tél: ${p.tel}`, 20, 30);
            let y = 45;
            p.visites.forEach(v => {
                if(y > 220) { doc.addPage(); y = 20; }
                doc.setFont(undefined, 'bold'); doc.text(`VISITE DU ${v.date}`, 20, y); y += 7;
                doc.setFont(undefined, 'normal'); doc.text(`PARAMÈTRES : TA ${v.ta} | P ${v.pouls} | T ${v.temp}°C | FR ${v.fr} | Sat ${v.sat}%`, 20, y); y += 7;
                const lines = [
                    `Motif : ${v.motif}`,
                    `Examen : Gen: ${v.general} | Hem: ${v.hemo} | Res: ${v.respi} | Abd: ${v.abd} | Neu: ${v.neuro} | Reste: ${v.reste}`,
                    `Traitement : ${v.traitement}`
                ];
                lines.forEach(l => {
                    const split = doc.splitTextToSize(l, 170);
                    doc.text(split, 20, y);
                    y += (split.length * 6) + 2;
                });
                y += 5;
            });
            doc.save(`DocPocket_Pro_${p.nom}.pdf`);
        }

        function calculerAgeAuto(v) { if(v.length===4) document.getElementById('p-age').value = (new Date().getFullYear()-v) + " ANS"; }
        function afficherPatients() {
            const q = document.getElementById('search').value.toUpperCase();
            document.getElementById('patientList').innerHTML = patients.filter(p => p.nom.includes(q)).map(p => `
                <div onclick="voirDossier(${p.id})" class="medical-card flex justify-between items-center cursor-pointer">
                    <div><h3 class="font-black text-lg uppercase">${p.nom}</h3><p class="text-[10px] font-bold text-blue-600">${p.dob} • ${p.visites.length} Visite(s)</p></div>
                    <span class="text-blue-200">❯</span>
                </div>`).join('');
        }
        function retourListe() { patientActuelId=null; document.getElementById('vue-liste').classList.remove('hidden'); document.getElementById('vue-dossier').classList.add('hidden'); afficherPatients(); }
        function ouvrirNouveauPatient() { patientActuelId=null; document.getElementById('form-patient-info').classList.remove('hidden'); document.getElementById('modal-consult').classList.remove('hidden'); }
        function fermerModal() { document.getElementById('modal-consult').classList.add('hidden'); }
        function supprimerPatientTotal() { if(confirm("Supprimer ce dossier ?")) { patients=patients.filter(p=>p.id!==patientActuelId); sauvegarderDB(); retourListe(); } }
    </script>
</body>
</html>
